<style>
:root{
  --bg:#fbf5f7; --card:#fff; --ink:#2b1d24; --sub:#7a5f6b; --line:#efd9e2;
  --pri:#a83d6b; --pri2:#c75b87; --acc:#7b3f8c; --ok:#2f7d4f; --warn:#b7791f; --bad:#b42318;
  --soft:#fcebf2; --chip:#f7e2ea;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-size:15px}
nav.tabs{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:6px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;color:var(--sub)}
nav.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
nav.tabs button.jy{border-color:#dcc4e6}
nav.tabs button.jy.on{background:var(--acc);border-color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px;margin:0 0 14px}
.card h2{font-size:18px;margin:0 0 10px;color:var(--pri)}
.card h3{font-size:16px;margin:14px 0 8px;color:var(--pri2)}
.jycard h2{color:var(--acc)}
.row{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:640px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:14px;color:var(--sub);margin-bottom:4px}
input[type=text],input[type=password],input[type=tel],input[type=date],input[type=datetime-local],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:90px;resize:vertical}
textarea.big{min-height:180px}
.dt{display:flex;gap:8px}
.dt input{flex:1}
.dt button,.btn{border:1px solid var(--pri2);background:#fff;color:var(--pri2);border-radius:10px;padding:9px 13px;min-height:44px;white-space:nowrap}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;min-height:42px}
.opts label:has(input:checked){background:var(--soft);border-color:var(--pri2)}
.opts input{width:18px;height:18px;margin:0;accent-color:var(--pri)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.ck:first-of-type{border-top:0}
.ck input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--ok)}
.ck .t{flex:1}
.ck .t small{display:block;color:var(--sub);font-size:13.5px}
.ck .t input[type=text]{margin-top:6px;min-height:40px}
.q{padding:10px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .ql{display:flex;gap:8px;align-items:flex-start}
.q .ql input{width:20px;height:20px;flex:0 0 20px;margin-top:3px;accent-color:var(--ok)}
.q .ql b{font-weight:500}
.q .ql small{display:block;color:var(--sub);font-size:13.5px}
.q textarea,.q input[type=text]{margin-top:6px;min-height:40px}
.q textarea{min-height:60px}
.note{background:var(--soft);border-left:4px solid var(--pri2);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.note.w{background:#fff6ea;border-color:var(--warn)}
.note.b{background:#fdecea;border-color:var(--bad)}
.note.g{background:#eaf6ef;border-color:var(--ok)}
.note p{margin:4px 0}
.law{font-size:14px;color:var(--sub)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:13.5px;margin:2px 4px 2px 0}
.chip.r{background:#fde4d8;color:#8a3412}
.chip.g{background:#dff1e6;color:#1f5e3a}
.chip.y{background:#fff1cc;color:#7a5600}
.big-num{font-size:26px;font-weight:700}
.clock-res{border-radius:12px;padding:12px;margin:0 0 12px}
.clock-res.ok{background:#eaf6ef}
.clock-res.bad{background:#fdecea}
.list .item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:0 0 10px}
.list .item .m{flex:1;min-width:0}
.list .item .m b{display:block}
.list .item .m small{color:var(--sub)}
.tag{font-size:12.5px;border-radius:6px;padding:2px 7px;color:#fff;background:var(--pri2)}
.tag.jy{background:var(--acc)}
table.lib{width:100%;border-collapse:collapse;font-size:15px}
table.lib td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
details{border:1px solid var(--line);border-radius:12px;background:#fff;margin:0 0 10px;padding:0 12px}
details summary{padding:12px 0;font-weight:600;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
.obs{border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 10px;background:#fafbfc}
.court-view{position:fixed;inset:0;z-index:50;background:#111;color:#f3f3f3;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 40px;display:none}
.court-view.on{display:block}
.court-view .ctl{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding-bottom:10px;background:#111}
.court-view .ctl button{background:#333;color:#fff;border:0;border-radius:10px;padding:9px 14px}
.court-view .txt{font-size:24px;line-height:1.75;white-space:pre-wrap;max-width:1000px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:.95}
.muted{color:var(--sub);font-size:14px}
hr.s{border:0;border-top:1px solid var(--line);margin:12px 0}
#printArea{display:none}
.lockbox{max-width:360px;margin:12vh auto 0;text-align:center}
.lockbox input{text-align:center;font-size:24px;letter-spacing:6px}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
function nowLocal(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function todayStr(){return nowLocal().slice(0,10)}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o)}
function setP(o,p,v){const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=='object')a[k]={};a=a[k]});a[ks[ks.length-1]]=v}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
function pd(s){if(!s)return null;const d=new Date(s.length===10?s+'T00:00':s);return isNaN(d)?null:d}
function roc(s){const d=pd(s);if(!d)return {y:'',m:'',d:'',h:'',mi:''};return {y:d.getFullYear()-1911,m:d.getMonth()+1,d:d.getDate(),h:d.getHours(),mi:pad(d.getMinutes())}}
function rocDate(s){const r=roc(s);return r.y?`${r.y}年${r.m}月${r.d}日`:''}
function rocDT(s){const r=roc(s);return r.y?`${r.y}年${r.m}月${r.d}日${r.h}時${r.mi}分`:''}

function addMonths(d,n){const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x}
function hm(ms){const neg=ms<0;ms=Math.abs(ms);const h=Math.floor(ms/3600000),m=Math.round((ms%3600000)/60000);return (neg?'-':'')+h+'小時'+m+'分'}

const ENC_KEY='pzjy_enc_v1';
let sessKey=null,sessSalt=null,locked=false,saveChain=Promise.resolve();
function b64e(buf){const u=new Uint8Array(buf);let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)}
function b64d(t){const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encStr(key,salt,str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(str));return {salt:b64e(salt),iv:b64e(iv),data:b64e(ct)}}
async function decBlob(key,blob){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv)},key,b64d(blob.data));return JSON.parse(new TextDecoder().decode(pt))}
async function encPw(pw,obj){const salt=crypto.getRandomValues(new Uint8Array(16));return encStr(await deriveKey(pw,salt),salt,JSON.stringify(obj))}
async function decPw(pw,blob){return decBlob(await deriveKey(pw,b64d(blob.salt)),blob)}
function load(){
  try{Object.assign(settings,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
  if(localStorage.getItem(ENC_KEY)){locked=true;cases={};view='lock';return}
  try{cases=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){cases={}}
}
function save(){
  if(cur){cur.updated=Date.now();cases[cur.id]=cur}
  if(locked)return;
  if(sessKey){const k=sessKey,sl=sessSalt,snap=JSON.stringify(cases);
    saveChain=saveChain.then(async()=>{const blob=await encStr(k,sl,snap);localStorage.setItem(ENC_KEY,JSON.stringify(blob))}).catch(()=>toast('儲存失敗'));return}
  try{localStorage.setItem(KEY,JSON.stringify(cases))}catch(e){toast('儲存失敗：裝置空間不足')}
}
async function unlock(pin){
  try{const blob=JSON.parse(localStorage.getItem(ENC_KEY));const salt=b64d(blob.salt);const key=await deriveKey(pin,salt);
    cases=await decBlob(key,blob);sessKey=key;sessSalt=salt;locked=false;view='list';cur=null;lastAct=Date.now();render();toast('已解鎖')}
  catch(e){toast('密碼錯誤');const i=$('#pinIn');if(i){i.value='';i.focus()}}
}
async function lockNow(){
  if(!sessKey)return;
  try{await saveChain}catch(e){}
  sessKey=null;sessSalt=null;cases={};cur=null;locked=true;view='lock';
  $('#courtView').classList.remove('on');document.querySelector('.modal')?.remove();render();window.scrollTo(0,0);
}
async function setPin(pin){
  const salt=crypto.getRandomValues(new Uint8Array(16));const key=await deriveKey(pin,salt);
  const blob=await encStr(key,salt,JSON.stringify(cases));localStorage.setItem(ENC_KEY,JSON.stringify(blob));localStorage.removeItem(KEY);
  sessKey=key;sessSalt=salt;
}

function showDownload(name,text,note,mime='application/json',title='案件檔已準備好'){
  const blob=new Blob([text],{type:mime});const u=URL.createObjectURL(blob);
  let file=null;try{file=new File([blob],name,{type:mime})}catch(e){}
  const canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  const canPick=!!window.showSaveFilePicker;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 8px;color:var(--pri);font-size:18px">${esc(title)}</h2><p class="muted">${esc(note)}</p><p style="word-break:break-all">${esc(name)}</p>
  <div class="btns">${canShare?'<button class="btn pri" data-share="1">儲存到檔案（選資料夾）</button>':''}${canPick?'<button class="btn pri" data-pick="1">選擇資料夾儲存</button>':''}<a class="btn ${canShare||canPick?'':'pri'}" href="${u}" download="${esc(name)}" style="text-decoration:none">${canShare||canPick?'下載':'儲存檔案'}</a><button class="btn" data-close="1">關閉</button></div>
  <p class="muted">${canShare?'iPad、iPhone：點「儲存到檔案」→ 選「儲存到檔案」→ 切到 Dropbox → 選資料夾 → 儲存。之後會記得上次的資料夾。':canPick?'電腦：點「選擇資料夾儲存」，直接選 Dropbox 裡的資料夾。':'下載後再移到 Dropbox 的案件資料夾。'}</p></div>`;
  const close=()=>{m.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
  m.addEventListener('click',async e=>{
    const t=e.target;
    if(t.dataset.close||t===m){close();return}
    if(t.dataset.share){try{await navigator.share({files:[file],title:name});close();toast('已送出')}catch(err){if(err&&err.name!=='AbortError')toast('無法開啟分享，請改用「下載」')}return}
    if(t.dataset.pick){try{const ext=name.slice(name.lastIndexOf('.'));const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:title,accept:{[mime]:[ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();close();toast('已儲存')}catch(err){if(err&&err.name!=='AbortError')toast('儲存失敗，請改用「下載」')}return}
  });
  document.body.appendChild(m);
}

    toast('加密中…');payload={app:'pzjy',v:2,enc:await encPw(pw,{cases:arr})};note='已加密，匯入時需輸入密碼。'}

}

function qaData(){if(!cur.qa)cur.qa={sessions:[],cur:0};return cur.qa}

function newSession(kind){const q=qaData();q.sessions.push({id:uid(),kind,start:nowLocal(),end:'',place:cur.unit||'',officer:'',items:[{q:'',a:'',note:'',t:nowLocal().slice(11)}]});q.cur=q.sessions.length-1}

  <div class="btns">${QA_KINDS.map(k=>`<button class="btn sm" data-qnew="${k}">＋${k}</button>`).join('')}</div></div>`;

    <div class="qa-row"><span class="qa-lb">問：</span><textarea class="qa-in" rows="1" data-p="${P}.items.${i}.q" data-qi="${i}" data-qf="q">${esc(it.q)}</textarea></div>
    <div class="qa-row"><span class="qa-lb">答：</span><textarea class="qa-in" rows="1" data-p="${P}.items.${i}.a" data-qi="${i}" data-qf="a">${esc(it.a)}</textarea></div>
    ${it.note||it._n?`<div class="qa-row"><span class="qa-lb" style="color:var(--acc)">註：</span><textarea class="qa-in" rows="1" data-p="${P}.items.${i}.note" placeholder="律師觀察、程序異議、提示證據、待查事項">${esc(it.note)}</textarea></div>`:''}

function qaText(sessions){
  return sessions.map(s=>{let t=`【${s.kind}】${s.start?rocDT(s.start):''}${s.end?'～'+rocDT(s.end).replace(/^\d+年\d+月\d+日/,''):''}\n地點：${s.place||''}　詢（訊）問人：${s.officer||''}\n`;
    s.items.filter(it=>it.q||it.a||it.note).forEach(it=>{t+=`問：${it.q}\n答：${it.a}\n`;if(it.note)t+=`（註：${it.note}）\n`});return t}).join('\n');
}
function autoGrow(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('qa-in')||e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229)return;
  const i=+t.dataset.qi,f=t.dataset.qf;if(isNaN(i))return;
  e.preventDefault();
  if(f==='q'){const n=document.querySelector(`.qa-in[data-qi="${i}"][data-qf="a"]`);n&&n.focus();return}
  const s=qaSess();
  if(i===s.items.length-1){s.items.push({q:'',a:'',note:'',t:nowLocal().slice(11)});save();const y=window.scrollY;render();window.scrollTo(0,y)}
  const n=document.querySelector(`.qa-in[data-qi="${i+1}"][data-qf="q"]`);if(n){n.focus();n.scrollIntoView({block:'center'})}
});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('qa-in'))autoGrow(e.target)});

function clockCalc(){
  const k=cur.jy.clk;const a=pd(k.arrest),f=pd(k.filed);
  let obs=0;(k.obs||[]).forEach(o=>{const s=pd(o.s),e=pd(o.e);if(s&&e&&e>s)obs+=e-s});
  if(!a)return null;
  const deadline=new Date(a.getTime()+24*3600000+obs);
  const res={a,obs,deadline};
  if(f){res.used=f-a-obs;res.over=res.used>24*3600000}
  return res;
}
const OBS_TYPES=['①交通障礙或不可抗力','②在途解送時間','③夜間不得詢問（§100-3 I）','④身體健康突發事由','⑤等候辯護人到場（≦4小時）','⑥等候通譯（≦6小時）','⑦候保、候責付（≦4小時）','⑧法院提審期間','律見時間（§34 II，≦1小時）'];

const CN=['一','二','三','四','五','六','七','八','九','十'];
function pick(list,ids){return list.filter(([id])=>ids.includes(id)).map(x=>x[1])}
function genStatement(forAppeal){
  const c=cur,j=c.jy,a=j.a,parts=[];
  const r=clockCalc();
  // 程序
  const pr=[];
  if(a.proc.includes('arrest'))pr.push('偵查中聲請羈押採拘捕前置原則，須以合法拘提或逮捕為前提。本件被告之拘提、逮捕程序有違法疑慮'+(a.procNote?'：'+a.procNote:'')+'，羈押之聲請即不合法。');
  if(a.proc.includes('time'))pr.push(`依刑事訴訟法第93條第2項，檢察官應自拘提或逮捕之時起24小時內聲請羈押。本件被告於${r?fmtDT(r.a):'○○'}遭拘捕${r&&r.used!=null?`，扣除同法第93條之1法定障礙期間後，至聲請時已計入${hm(r.used)}`:''}，已逾法定期間，聲請程序違法。`);
  if(a.proc.includes('night'))pr.push('司法警察於夜間詢問被告，不符刑事訴訟法第100條之3第1項但書各款情形，依同法第158條之2第1項，所取得之自白及其他不利陳述不得作為證據，亦不得據為認定犯罪嫌疑重大之依據。');
  if(a.proc.includes('notice'))pr.push('依刑事訴訟法第101條第3項，羈押所依據之事實、理由及證據應告知被告及辯護人並記載於筆錄；經法院禁止被告及辯護人獲知之卷證，不得作為羈押審查之依據。');
  if(a.proc.includes('bodycam'))pr.push('為釐清拘捕經過，請求當庭勘驗執行拘捕、搜索員警之密錄器影像。');
  if(pr.length)parts.push(['程序部分',pr]);
  // 嫌疑
  if(a.suspect)parts.push(['犯罪嫌疑部分',['檢察官所提證據尚不足使 鈞院認被告犯罪嫌疑重大'+(a.suspectNote?'：'+a.suspectNote:'')+'。']]);
  // 原因
  const rs=[];
  const fl=pick(ARG.flee,a.flee);
  if(fl.length||a.fleeNote)rs.push(`關於逃亡之虞：被告${fl.join('，')}${a.fleeNote?(fl.length?'，':'')+a.fleeNote:''}，客觀上並無逃亡之動機與可能。逃亡之虞須有具體事實佐證，不得僅以被告於偵查中未完全配合或無資力交保即予推論，檢察官就此並未提出具體事證。`);
  const co=pick(ARG.coll,a.coll);
  if(co.length||a.collNote)rs.push(`關於湮滅、偽造、變造證據或勾串共犯、證人之虞：本件${co.join('，')}${a.collNote?(co.length?'，':'')+a.collNote:''}，相關證據均已固定。檢察官並未具體指明被告將與何人勾串、該人可證明何事，難認有事實足認有勾串之虞。`);
  if(a.heavy||a.heavyNote)rs.push('關於重罪羈押：依司法院釋字第665號解釋意旨，所犯為重罪不得作為羈押之唯一理由，仍須有相當理由認被告有逃亡、湮滅證據或勾串共犯、證人之虞。'+(a.heavyNote||'本件除罪名刑度外，並無其他相當理由。'));
  const rp=pick(ARG.rep,a.rep);
  if(rp.length||a.repNote)rs.push(`關於反覆實行同一犯罪之虞：預防性羈押係對被告未來行為之預測，與無罪推定原則有所緊張，應從嚴認定，檢察官須提出被告未來有反覆實行之具體事證，不得僅以本案犯行推論。本件${rp.join('，')}${a.repNote?(rp.length?'，':'')+a.repNote:''}，被告再犯之外在條件已不存在。`);
  if(rs.length)parts.push(['羈押原因部分',rs]);
  // 必要性
  const alt=[];
  if(a.bail)alt.push(`命被告提出新臺幣${Number(a.bail).toLocaleString()}元之保證金具保`);
  if(a.guarantor)alt.push(`責付${a.guarantor}`);
  if(a.address)alt.push(`限制住居於${a.address}`);
  if(a.noExit)alt.push('限制出境出海');
  if(a.report)alt.push(`命定期至${a.report}報到`);
  if(a.noContact)alt.push('命不得接觸共犯、被害人及證人');
  if(a.monitor)alt.push('命接受科技設備監控');
  const ne=[];
  if(alt.length)ne.push(`退步言之，縱認被告仍有羈押原因，亦得以${alt.join('、')}等替代手段，對被告形成相當之心理拘束力及行為制約效果，足以達成保全目的，並無羈押之必要。`);
  if(a.progress)ne.push(a.progress);
  if(ne.length)parts.push(['羈押必要性部分',ne]);
  if(a.r114.length){const m={'1':'所犯最重本刑為三年以下有期徒刑之罪','2':'懷胎五月以上或生產後未滿二月','3':'現罹疾病，非保外治療顯難痊癒'};parts.push(['刑事訴訟法第114條部分',[`被告${a.r114.map(x=>m[x]).join('，且')}，依刑事訴訟法第114條、第101條之2後段，非有不能具保、責付或限制住居之情形，不得羈押；如經具保聲請停止羈押，亦不得駁回。`]])}
  if(a.extra)parts.push(['其他',[a.extra]]);
  if(forAppeal)return parts;
  const end={inv:'綜上所述，請 鈞院駁回檢察官羈押之聲請；如認仍有必要，請准以較低金額具保，或以責付、限制住居、限制出境出海等方式替代羈押。',trial:'綜上所述，請 鈞院審酌上情，免予羈押，改以具保、責付或限制住居等處分替代。',ext:'綜上所述，原羈押原因已不存在或已無繼續羈押之必要，請駁回延長羈押之聲請，或准予具保停止羈押。',bail:'綜上所述，請 鈞院准予被告具保停止羈押。',habeas:'綜上所述，請 鈞院先就提審為審查，認逮捕拘禁不合法者裁定釋放；並駁回羈押之聲請。'}[j.entry]||'';
  let t='辯護人意見如下：\n';
  parts.forEach(([h,arr],i)=>{t+=`${CN[i]}、${h}：\n`;arr.forEach((s,k)=>{t+=(arr.length>1?`（${CN[k]}）`:'')+s+'\n'})});
  t+=`${CN[parts.length]}、${end}`;
  return t;
}
function genAppeal(){
  const parts=genStatement(true);const j=cur.jy;
  let t=`一、原裁定意旨略以：${j.gist||'○○○'}。\n二、惟查：\n`;
  parts.forEach(([h,arr],i)=>{t+=`（${CN[i]}）${h}：\n`;arr.forEach((s,k)=>{t+=(arr.length>1?`${k+1}、`:'')+s+'\n'})});
  t+=`三、綜上所述，原裁定認被告有羈押之原因及必要，尚有違誤，爰依刑事訴訟法第404條第1項第2款、第406條規定提起抗告，請撤銷原裁定，更為適當之裁定。`;
  return t;
}
function genSummary(){

}

FORMS.qa=()=>{const c=cur;return `<div class="pg doc" style="font-size:12pt;line-height:1.8">

FORMS.sum=()=>{const c=cur,j=c.jy,cr=crimeOf(c);const r=isJy(c)?clockCalc():null;
 const qa=Object.entries(j.meet||{}).filter(([k,v])=>v&&(v.a||v.d)).map(([k,v])=>{const all=[...MEET_Q.flatMap(g=>g.items),...(cr?cr.q.map((t,i)=>['cq'+i,t]):[])];const it=all.find(x=>x[0]===k);return `<p>・${esc(it?it[1]:k)}：${esc(v.a||'（已問）')}</p>`}).join('');
 const rn=Object.entries(j.readNote||{}).filter(([k,v])=>v).map(([k,v])=>{const it=READ_CHECK.flatMap(g=>g.items).find(x=>x[0]===k);return `<p>・${esc(it?it[1]:k)}：${esc(v)}</p>`}).join('');
 return `<div class="pg doc" style="font-size:11pt">
 <div class="ttl">案件摘要</div>
 <p>${c.type==='pz'?'檢警陪偵':'羈押審查'}｜當事人：${esc(c.name)}｜案由：${esc(caseLabel())}｜建立：${fmtDT(new Date(c.created))}</p>
 <p>地點／機關：${esc(c.unit)}${c.unitAddr?'（'+esc(c.unitAddr)+'）':''}　承辦：${esc(c.officer)}　案號：${esc(c.caseNo)} ${esc(c.stock)}</p>
 ${c.type==='pz'?`<h4>陪訊</h4><p>出發：${rocDT(c.pz.segs[0].depart)}　到場：${rocDT(c.pz.segs[0].arrive)}　完成：${rocDT(c.pz.segs[0].finish)}</p><p>移送：${esc(c.pz.transfer)}　聲押：${esc(c.pz.detainApply)}　准押：${esc(c.pz.detainGranted)}　法扶申請：${esc(c.la.apply)}</p>${c.pz.notes?`<div class="txtblk">${esc(c.pz.notes)}</div>`:''}`:''}
 ${isJy(c)?`<h4>羈押審查</h4><p>${esc((ENTRIES[j.entry]||{}).n||'')}｜${esc(j.court)} ${esc(j.caseNo)}｜開庭：${rocDT(j.hearing)}</p>
 ${r?`<p>拘捕：${fmtDT(r.a)}　障礙：${hm(r.obs)}　最遲聲請：${fmtDT(r.deadline)}${r.used!=null?'　計入：'+hm(r.used)+(r.over?'（逾時）':''):''}</p>`:''}
 ${j.prosEvid?`<p>檢方事證：${esc(j.prosEvid)}</p>`:''}${rn?`<h4>閱卷筆記</h4>${rn}`:''}${qa?`<h4>律見</h4>${qa}`:''}${j.meetNote?`<div class="txtblk">${esc(j.meetNote)}</div>`:''}
 ${j.stmt?`<h4>開庭陳述</h4><div class="txtblk">${esc(j.stmt)}</div>`:''}
 <h4>結果</h4><p>${esc(j.result)} ${esc(j.resultNote)}</p>`:''}
 </div>`};

function selUnit(full){const a=findAgency(full);if(!a){cur.unit='';cur.unitAddr='';return}cur.unit=full;cur.unitG=a.g;cur.unitAddr=a.addr;
  const r=(settings.recentUnits||[]).filter(x=>x!==full);r.unshift(full);settings.recentUnits=r.slice(0,8);saveSettings();
  if(cur.qa)cur.qa.sessions.forEach(s=>{if(!s.place)s.place=full})}
/* ================== 事件 ================== */
function onField(e){
  const t=e.target;
  if(cur&&e.type==='change'&&t.dataset.unitg){cur.unitG=t.value;if(t.value==='__other'){if(findAgency(cur.unit)){cur.unit='';cur.unitAddr=''}}else{const g=AGENCIES.find(a=>a.g===t.value);if(g&&g.items.length===1){selUnit(unitFull(g.g,g.items[0][0]))}}save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(cur&&e.type==='change'&&t.dataset.unitn){selUnit(t.value);save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(cur&&e.type==='change'&&t.dataset.recent){selUnit(t.dataset.recent);save();const y=window.scrollY;render();window.scrollTo(0,y);return}if(!cur&&!t.dataset.s)return;
  if(t.dataset.s){settings[t.dataset.s]=t.value;saveSettings();return}
  if(t.dataset.p!=null){
    let v=t.value; if(t.type==='radio'&&!t.checked)return;
    setP(cur,t.dataset.p,v);
  }else if(t.dataset.m){
    const arr=(getP(cur,t.dataset.m)||[]).slice();const i=arr.indexOf(t.value);
    if(t.checked&&i<0)arr.push(t.value);if(!t.checked&&i>=0)arr.splice(i,1);setP(cur,t.dataset.m,arr);
  }else if(t.dataset.b){setP(cur,t.dataset.b,t.checked)}
  else if(t.dataset.sel){const s=cur._sel||[];const i=s.indexOf(t.dataset.sel);if(t.checked&&i<0)s.push(t.dataset.sel);if(!t.checked&&i>=0)s.splice(i,1);cur._sel=s}
  else return;
  save();
  if(t.dataset.re&&e.type==='change'){const y=window.scrollY;render();window.scrollTo(0,y)}
  if(t.dataset.p==='name'&&cur)$('#hTitle').textContent=(cur.name||'（未填姓名）')+'｜'+(cur.type==='pz'?'檢警陪偵':'羈押審查');
}
document.addEventListener('input',e=>{if(e.target.type!=='radio'&&e.target.type!=='checkbox')onField(e)});
document.addEventListener('change',onField);

function buildPrint(){
  const order=['wt','rec','la','rel','qa','stmt','app','sum'];
  const sel=(cur._sel||[]).filter(k=>FORMS[k]);
  const avail=[...document.querySelectorAll('[data-sel]')].map(x=>x.dataset.sel);
  return order.filter(k=>sel.includes(k)&&avail.includes(k)).map(k=>FORMS[k]()).join('');
}
function download(name,text){
  const blob=new Blob([text],{type:'application/json'});const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1000);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-tab]');if(!b)return;
  const d=b.dataset;
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.new){cur=newCase(d.new);tab='basic';view='case';save();render();return}
  if(d.open){cur=cases[d.open];tab='basic';view='case';render();window.scrollTo(0,0);return}
  if(d.now){setP(cur,d.now,nowLocal());save();const y=window.scrollY;render();window.scrollTo(0,y);toast('已記錄 '+nowLocal().slice(11));return}
  if(d.delcase){const c=cases[d.delcase];if(c&&confirm(`整件刪除「${c.name||'未命名'}」？\n陪偵、羈押、法扶申請等全部資料都會刪除，無法復原。${c.exported?'':'\n\n注意：此案尚未匯出備份。'}`)){delete cases[d.delcase];if(cur&&cur.id===d.delcase)cur=null;save();render();toast('已刪除')}return}
  if(d.qnew){newSession(d.qnew);save();render();{const n=document.querySelector('.qa-in[data-qi="0"][data-qf="q"]');n&&n.focus()}return}
  if(d.qsess!=null){qaData().cur=+d.qsess;save();render();return}
  if(d.qdel!=null){const s=qaSess();const it=s.items[+d.qdel];if((it.q||it.a||it.note)&&!confirm('刪除這組問答？'))return;s.items.splice(+d.qdel,1);if(!s.items.length)s.items.push({q:'',a:'',note:'',t:nowLocal().slice(11)});save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(d.qnote!=null){const it=qaSess().items[+d.qnote];if(it.note||it._n){if(it.note&&!confirm('收合會清除這則註記，確定？'))return;it.note='';it._n=false}else it._n=true;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(d.delobs!=null){cur.jy.clk.obs.splice(+d.delobs,1);save();render();return}
  const act=d.act;if(!act)return;
  const rr=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  switch(act){
   case 'home':view='list';cur=null;render();break;
   case 'settings':view='set';render();break;
   case 'autoLab':{const cr=crimeOf(cur);if(cr){cur.labCats=cr.lab.length?cr.lab.slice():['其他']}save();rr();break}
   case 'autoNR':cur.pz.noReason=autoNoReason(cur);save();rr();break;
   case 'clrNR':cur.pz.noReason=[];save();rr();break;
   case 'laFill':{const l=cur.la;l.eth=l.eth||(cur.abor?'原住民':cur.foreign?'外籍':'一般');if(cur.abor&&!l.ethTxt)l.ethTxt=cur.tribe;if(cur.foreign&&!l.ethTxt)l.ethTxt=cur.nation;l.cphone=l.cphone||cur.phone;l.cannot=l.cannot||(cur.mental?'是':'否');if(!l.proc.length)l.proc=['inv'];if(cur.pz.detainGranted==='是'&&!l.proc.includes('app'))l.proc.push('app');save();rr();toast('已帶入');break}
   case 'laSum':if(cur.la.summary&&!confirm('覆蓋現有案情概述？'))break;cur.la.summary=genSummary();save();rr();break;
   case 'qaAdd':{const s=qaSess();s.items.push({q:'',a:'',note:'',t:nowLocal().slice(11)});save();rr();const n=document.querySelector(`.qa-in[data-qi="${s.items.length-1}"][data-qf="q"]`);if(n){n.focus();n.scrollIntoView({block:'center'})}break}
   case 'qaCopy':{const t=qaText([qaSess()]);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已複製')).catch(()=>toast('無法複製'));break}
   case 'qaWord':{const s=qaSess();const body=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:"標楷體","DFKai-SB",serif;font-size:14pt;line-height:1.8}p{margin:0}</style></head><body><p style="text-align:center;font-size:18pt"><b>詢問／訊問筆記</b></p><p style="font-size:11pt">當事人：${esc(cur.name)}　案由：${esc(caseLabel())}　記錄人：${esc(settings.lawyer)}律師</p><p style="font-size:11pt">※本紀錄為律師陪同在場時自行記錄，非機關製作之正式筆錄。</p><br>${esc(qaText([s])).split('\n').map(l=>`<p>${l||'&nbsp;'}</p>`).join('')}</body></html>`;
     showDownload(`${fileTag(cur)}-${s.kind}筆記.doc`,'﻿'+body,'Word 可直接開啟編輯。','application/msword','詢問筆記已準備好');break}
   case 'qaDelSess':{const q=qaData();if(!confirm('刪除這整段詢問紀錄？無法復原。'))break;q.sessions.splice(q.cur,1);q.cur=Math.max(0,q.cur-1);save();rr();break}
   case 'addObs':cur.jy.clk.obs=cur.jy.clk.obs||[];cur.jy.clk.obs.push({t:OBS_TYPES[2],s:'',e:''});save();rr();break;
   case 'genStmt':if(cur.jy.stmt&&!confirm('重新產生會覆蓋你修改過的陳述稿，確定？'))break;cur.jy.stmt=genStatement();save();rr();toast('已產生');break;
   case 'genApp':if(cur.jy.appealStmt&&!confirm('覆蓋現有抗告理由？'))break;cur.jy.appealStmt=genAppeal();save();rr();break;
   case 'court':{$('#cvText').textContent=cur.jy.stmt||genStatement();$('#courtView').classList.add('on');break}
   case 'copyStmt':{const t=cur.jy.stmt||genStatement();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('已複製')).catch(()=>toast('無法複製，請長按文字框選取'));break}
   case 'preview':{const h=buildPrint();$('#pv').innerHTML=h?`<div class="prev">${h}</div>`:'<p class="muted">請先勾選表單</p>';$('#pv').scrollIntoView({behavior:'smooth'});break}
   case 'print':{const h=buildPrint();if(!h){toast('請先勾選表單');break}$('#printArea').innerHTML=h;const old=document.title;document.title=fileTag(cur);setTimeout(()=>{window.print();setTimeout(()=>{document.title=old},500)},100);break}
   case 'exp':exportCases([cur],fileTag(cur)+'.json');break;
   case 'expAll':exportCases(Object.values(cases),`陪偵羈押-全部案件-${todayStr()}.json`);break;
   case 'unlock':unlock($('#pinIn').value);break;
   case 'wipe':if(confirm('清除這台裝置上的全部案件？')&&confirm('再次確認：清除後無法復原。')){localStorage.removeItem(ENC_KEY);localStorage.removeItem(KEY);cases={};locked=false;sessKey=null;view='list';render();toast('已清除')}break;
   case 'setPin':{const a=$('#pin1').value,b2=$('#pin2').value;if(a.length<6){toast('密碼至少6碼');break}if(a!==b2){toast('兩次密碼不同');break}toast('加密中…');setPin(a).then(()=>{lastAct=Date.now();render();toast('已設定密碼並加密')});break}
   case 'rmPin':if(confirm('移除密碼後，案件資料會改為未加密存放。確定？')){removePin();render();toast('已移除密碼')}break;
   case 'del':if(confirm(`刪除「${cur.name||'未命名'}」？刪除後無法復原（已匯出的案件檔不受影響）。`)){delete cases[cur.id];cur=null;view='list';save();render()}break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id!=='impFile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();rd.onload=async()=>{let o;try{o=JSON.parse(rd.result)}catch(err){toast('檔案格式不符');return}
    try{if(o.enc){const pw=prompt('請輸入此案件檔的密碼');if(pw===null)return;toast('解密中…');o=await decPw(pw,o.enc)}}catch(err){toast('密碼錯誤，無法開啟');return}
    const arr=o.cases||[];let n=0;
    arr.forEach(c=>{if(!c.id)return;if(cases[c.id]&&cases[c.id].updated>c.updated&&!confirm(`「${c.name}」在這台裝置上的版本較新，仍要用匯入檔覆蓋嗎？`))return;cases[c.id]=c;n++});
    const c0=cur;cur=null;save();cur=c0;toast(`已匯入 ${n} 件`);render()};rd.readAsText(f);
});
$('#hLock').onclick=()=>lockNow();
$('#hBack').onclick=()=>{if(locked)return;if(cur&&view==='case'&&needsExp(cur))toast('提醒：本案有更新尚未匯出');view='list';cur=null;render();window.scrollTo(0,0)};
$('#hLib').onclick=()=>{if(locked)return;if(view==='lib'){view=cur?'case':'list'}else{view='lib'}render();window.scrollTo(0,0)};
$('#cvClose').onclick=()=>$('#courtView').classList.remove('on');
let cvSize=24;$('#cvBig').onclick=()=>{cvSize+=3;$('#cvText').style.fontSize=cvSize+'px'};$('#cvSmall').onclick=()=>{cvSize=Math.max(15,cvSize-3);$('#cvText').style.fontSize=cvSize+'px'};
window.addEventListener('beforeunload',e=>{if(!locked&&Object.values(cases).some(needsExp)){e.preventDefault();e.returnValue='有案件尚未匯出最新資料'}});

load();render();
